{% extends 'base.html' %}
{% block title %}Создать задачу{% endblock %}
{% block content %}
<h2 class="mb-4">Создать задачу</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Название</label>
        <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Описание</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Сотрудник</label>
        <select name="employee" class="form-select" required>
            <option value="">-- Выберите сотрудника --</option>
            {% for emp in employees %}
            <option value="{{ emp.pk }}">{{ emp.full_name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Создать</button>
    <a href="{% url 'tasks:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
