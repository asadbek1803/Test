{% extends 'base.html' %}
{% block title %}Создать задачу{% endblock %}
{% block page_header %}Создать задачу{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold"><i class="bi bi-plus-circle-fill me-2 text-success"></i>Новая задача</h6>
            </div>
            <div class="card-body">
                <form method="post" onsubmit="showLoader()">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-medium">Название <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-type"></i></span>
                                <input type="text" name="title" class="form-control" placeholder="Введите название задачи" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-medium">Описание</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Подробное описание задачи (необязательно)"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-medium">Назначить сотруднику <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <select name="employee" class="form-select" required>
                                    <option value="">-- Выберите сотрудника --</option>
                                    {% for emp in employees %}
                                    <option value="{{ emp.pk }}">{{ emp.full_name }} — {{ emp.position }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            {% if not employees %}
                            <small class="text-warning mt-1 d-block">
                                <i class="bi bi-exclamation-triangle me-1"></i>Нет сотрудников. 
                                <a href="{% url 'employees:create' %}">Добавьте сотрудника</a> сначала.
                            </small>
                            {% endif %}
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success" {% if not employees %}disabled{% endif %}>
                            <i class="bi bi-check-lg"></i> Создать
                        </button>
                        <a href="{% url 'tasks:list' %}" class="btn btn-outline-secondary" onclick="showLoader()">
                            <i class="bi bi-x-lg"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
