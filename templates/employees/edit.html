{% extends 'base.html' %}
{% block title %}Редактировать сотрудника{% endblock %}
{% block page_header %}Редактировать сотрудника{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold">
                    <i class="bi bi-pencil-square me-2 text-warning"></i>{{ employee.full_name }}
                    <span class="badge bg-light text-dark ms-2 fw-normal">ID: {{ employee.id }}</span>
                </h6>
            </div>
            <div class="card-body">
                <form method="post" onsubmit="showLoader()">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">ФИО <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="full_name" class="form-control" value="{{ employee.full_name }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Телефон <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" name="phone" class="form-control" value="{{ employee.phone }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" value="{{ employee.email }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Должность <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                                <input type="text" name="position" class="form-control" value="{{ employee.position }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Зарплата <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">₽</span>
                                <input type="number" step="0.01" min="0" name="salary" class="form-control" value="{{ employee.salary|stringformat:'.2f' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Дата приема <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                <input type="date" name="hire_date" class="form-control" value="{{ employee.hire_date|date:'Y-m-d' }}" required>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                        <a href="{% url 'employees:list' %}" class="btn btn-outline-secondary" onclick="showLoader()">
                            <i class="bi bi-x-lg"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
