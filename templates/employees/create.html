{% extends 'base.html' %}
{% block title %}Добавить сотрудника{% endblock %}
{% block page_header %}Добавить сотрудника{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2 text-success"></i>Новый сотрудник</h6>
            </div>
            <div class="card-body">
                <form method="post" onsubmit="showLoader()">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">ФИО <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="Иванов Иван Иванович" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Телефон <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" name="phone" class="form-control" placeholder="+7 (999) 123-45-67" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Должность <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                                <input type="text" name="position" class="form-control" placeholder="Должность" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Зарплата <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">₽</span>
                                <input type="number" step="0.01" min="0" name="salary" class="form-control" placeholder="50000" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Дата приема <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                <input type="date" name="hire_date" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                        <a href="{% url 'employees:list' %}" class="btn btn-outline-secondary" onclick="showLoader()">
                            <i class="bi bi-x-lg"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
