{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm" style="animation: slideUp 0.4s ease;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-person-plus-fill text-success" style="font-size: 2.5rem;"></i>
                    </div>
                    <h4 class="fw-bold">Создать аккаунт</h4>
                    <p class="text-muted small">Зарегистрируйтесь в системе</p>
                </div>
                {% if error %}
                <div class="alert alert-danger d-flex align-items-center py-2 alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span class="small">{{ error }}</span>
                    <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Имя пользователя</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Подтверждение пароля</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password_confirm" class="form-control" placeholder="••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-medium">
                        <i class="bi bi-person-check me-1"></i> Зарегистрироваться
                    </button>
                </form>
                <p class="mt-3 text-center small mb-0">
                    Уже есть аккаунт? <a href="{% url 'login' %}" class="fw-medium">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
